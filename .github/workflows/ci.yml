name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: modcontxtpro tests
        working-directory: aegntic-MCP/modcontxtpro
        run: |
          npm ci --no-audit --no-fund
          npx jest

      - uses: astral-sh/setup-uv@v5

      - name: quick-data tests
        working-directory: mcp-servers/quick-data
        run: uv run --frozen pytest

      - name: ai-collaboration-hub tests
        working-directory: CLAEM/core-collaboration-system/ai-collaboration-hub
        run: uv run --frozen pytest tests/
